    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>ENCCEJA 2026 - Endereço</title>
    <link rel="stylesheet" href="endereco/css/rawline-fonts.css">
    <link rel="stylesheet" href="endereco/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Rawline", system-ui, sans-serif;
            margin: 0;
            background: #f0f2f5;
        }

        .top-strip {
            background: linear-gradient(90deg, #071D41 0%, #0C326F 100%);
        }

        .main-header {
            background: #1351B4;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #071D41 0%, #0C326F 100%);
            padding: 16px 24px;
        }

        .progress-bar {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #168821, #1B873F);
            border-radius: 2px;
        }

        .footer-main {
            background: #071D41;
        }

        .input-field {
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
            outline: none;
            font-family: inherit;
        }

        .input-field:focus {
            border-color: #1351B4;
            box-shadow: 0 0 0 3px rgba(19, 81, 180, 0.1);
        }

        .input-field.border-red-500 {
            border-color: #ef4444;
        }

        select.input-field {
            appearance: auto;
        }

        .submit-btn {
            background: linear-gradient(135deg, #168821 0%, #1B873F 100%);
            color: #fff;
            transition: all 0.2s;
            border-radius: 50px;
            border: none;
            cursor: pointer;
        }

        .submit-btn:disabled {
            background: #d1d5db;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .submit-btn:not(:disabled):hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(22, 136, 33, 0.3);
        }

        .user-banner {
            background: linear-gradient(135deg, #1351B4, #071D41);
            border-radius: 12px;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const userData = JSON.parse(localStorage.getItem('cpfData') || '{}');
            if (!userData.cpf) { window.location.href = '/inscricao'; return; }
            document.getElementById('cpf-display').textContent = userData.cpf;
            document.getElementById('nome-display').textContent = userData.name;

            const cepInput = document.getElementById('cep');
            let typingTimer;
            cepInput.addEventListener('input', function () {
                clearTimeout(typingTimer);
                const cep = this.value.replace(/\D/g, '');
                if (cep.length === 8) {
                    typingTimer = setTimeout(function () { buscarEnderecoPorCep(cep); }, 300);
                }
            });

            const form = document.getElementById('endereco-form');
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                const requiredFields = ['cep', 'logradouro', 'numero', 'bairro', 'cidade', 'uf', 'telefone'];
                let isValid = true;
                requiredFields.forEach(field => {
                    const input = document.getElementById(field);
                    if (!input.value.trim()) { isValid = false; input.classList.add('border-red-500'); }
                    else { input.classList.remove('border-red-500'); }
                });
                if (!isValid) { alert('Por favor, preencha todos os campos obrigatórios.'); return; }
                const endereco = {
                    cep: document.getElementById('cep').value,
                    logradouro: document.getElementById('logradouro').value,
                    numero: document.getElementById('numero').value,
                    complemento: document.getElementById('complemento').value,
                    bairro: document.getElementById('bairro').value,
                    cidade: document.getElementById('cidade').value,
                    uf: document.getElementById('uf').value,
                    telefone: document.getElementById('telefone').value
                };
                localStorage.setItem('enderecoData', JSON.stringify(endereco));
                window.location.href = '/local-prova' + window.location.search;
            });

            document.querySelectorAll('#endereco-form input, #endereco-form select').forEach(input => {
                input.addEventListener('input', validateForm);
            });
        });

        function validateForm() {
            const requiredFields = ['cep', 'logradouro', 'numero', 'bairro', 'cidade', 'uf', 'telefone'];
            let isValid = true;
            requiredFields.forEach(field => {
                const input = document.getElementById(field);
                if (!input.value.trim()) { isValid = false; input.classList.add('border-red-500'); }
                else {
                    input.classList.remove('border-red-500');
                    if (field === 'cep' && !/^\d{5}-?\d{3}$/.test(input.value)) { isValid = false; input.classList.add('border-red-500'); }
                    if (field === 'telefone' && !/^\(\d{2}\) \d{5}-\d{4}$/.test(input.value)) { isValid = false; input.classList.add('border-red-500'); }
                }
            });
            document.getElementById('submit-button').disabled = !isValid;
        }

        function buscarEnderecoPorCep(cep) {
            document.getElementById('loading-cep').classList.remove('hidden');
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading-cep').classList.add('hidden');
                    if (data.erro) { alert('CEP não encontrado.'); return; }
                    document.getElementById('logradouro').value = data.logradouro || '';
                    document.getElementById('bairro').value = data.bairro || '';
                    document.getElementById('cidade').value = data.localidade || '';
                    document.getElementById('uf').value = data.uf || '';
                    document.getElementById('numero').focus();
                    validateForm();
                })
                .catch(error => {
                    document.getElementById('loading-cep').classList.add('hidden');
                    alert('Erro ao buscar o CEP.');
                });
        }

        function formatarCep(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 8) value = value.substring(0, 8);
            if (value.length > 5) value = value.replace(/^(\d{5})(\d{1,3})$/, '$1-$2');
            input.value = value;
            validateForm();
        }

        function formatarTelefone(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 11) value = value.substring(0, 11);
            if (value.length > 0) {
                value = value.replace(/^(\d{2})/, '($1) ');
                if (value.length > 9) value = value.replace(/^(\(\d{2}\) \d{5})(\d+)$/, '$1-$2');
            }
            input.value = value;
            validateForm();
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('cep').addEventListener('keypress', function (e) { if (!/[0-9]/.test(e.key)) e.preventDefault(); });
            document.getElementById('telefone').addEventListener('keypress', function (e) { if (!/[0-9]/.test(e.key)) e.preventDefault(); });
        });
    </script>
</head>

<body class="flex flex-col min-h-screen">
    <!-- Top Strip -->
    <div class="top-strip text-white py-1.5">
        <div class="max-w-5xl mx-auto px-4 flex justify-between items-center text-xs">
            <img src="endereco/images/Imagem-29-03-2025-a-s-17-32.jpg" alt="Gov.br" class="h-5">
            <div class="flex gap-4 opacity-80">
                <span>ACESSO À INFORMAÇÃO</span>
                <span>PARTICIPE</span>
                <span>SERVIÇOS</span>
            </div>
        </div>
    </div>

    <!-- Main Header -->
    <header class="main-header py-3">
        <div class="max-w-5xl mx-auto px-4">
            <svg height="24" preserveAspectRatio="xMidYMid" viewBox="0 0 69 20" width="80"

                    fill="#fff" fill-rule="evenodd"></path>

        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow py-8 sm:py-12">
        <div class="max-w-2xl mx-auto px-4">
            <div class="text-center mb-6">
                <img alt="Logo ENCCEJA 2026" class="mx-auto" height="100" src="logo.png" width="360">
            </div>

            <!-- Progress -->
            <div class="mb-6">
                <div class="flex justify-between text-xs text-gray-500 mb-1.5">
                    <span class="font-semibold text-[#1351B4]">Etapa 3 de 5</span>
                    <span>Cadastro de Endereço</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 50%"></div>
                </div>
            </div>

            <!-- Form Card -->
            <div class="card">
                <div class="card-header">
                    <h2 class="text-white text-lg font-semibold flex items-center gap-2">
                        <i class="fas fa-map-marker-alt text-sm opacity-70"></i>
                        Cadastro de Endereço
                    </h2>
                </div>
                <div class="p-6">
                    <!-- User Info Banner -->
                    <div class="user-banner p-4 mb-6 text-white">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <p class="text-xs text-white/60">CPF</p>
                                <p id="cpf-display" class="font-semibold">...</p>
                            </div>
                            <div>
                                <p class="text-xs text-white/60">Nome Completo</p>
                                <p id="nome-display" class="font-semibold">...</p>
                            </div>
                        </div>
                    </div>

                    <form id="endereco-form" class="space-y-4">
                        <div>
                            <label class="block mb-1.5 text-sm font-semibold text-gray-700">CEP <span
                                    class="text-red-500">*</span></label>
                            <div class="relative">
                                <input type="tel" id="cep" class="input-field" inputmode="numeric"
                                    placeholder="00000-000" maxlength="9" oninput="formatarCep(this)">
                                <span id="loading-cep" class="hidden absolute right-3 top-1/2 -translate-y-1/2">
                                    <svg class="animate-spin h-5 w-5 text-[#1351B4]" xmlns="http://www.w3.org/2000/svg"
                                        fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                            stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor"
                                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                        </path>
                                    </svg>
                                </span>
                            </div>
                            <p class="text-xs text-gray-400 mt-1">Digite o CEP para preencher automaticamente</p>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block mb-1.5 text-sm font-semibold text-gray-700">Logradouro <span
                                        class="text-red-500">*</span></label>
                                <input type="text" id="logradouro" class="input-field" placeholder="Rua, Avenida...">
                            </div>
                            <div>
                                <label class="block mb-1.5 text-sm font-semibold text-gray-700">Número <span
                                        class="text-red-500">*</span></label>
                                <input type="text" id="numero" class="input-field" placeholder="Nº">
                            </div>
                        </div>

                        <div>
                            <label class="block mb-1.5 text-sm font-semibold text-gray-700">Complemento</label>
                            <input type="text" id="complemento" class="input-field" placeholder="Apt, Bloco...">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block mb-1.5 text-sm font-semibold text-gray-700">Bairro <span
                                        class="text-red-500">*</span></label>
                                <input type="text" id="bairro" class="input-field" placeholder="Bairro">
                            </div>
                            <div>
                                <label class="block mb-1.5 text-sm font-semibold text-gray-700">Cidade <span
                                        class="text-red-500">*</span></label>
                                <input type="text" id="cidade" class="input-field" placeholder="Cidade">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block mb-1.5 text-sm font-semibold text-gray-700">Estado <span
                                        class="text-red-500">*</span></label>
                                <select id="uf" class="input-field">
                                    <option value="">Selecione...</option>
                                    <option value="AC">Acre</option>
                                    <option value="AL">Alagoas</option>
                                    <option value="AP">Amapá</option>
                                    <option value="AM">Amazonas</option>
                                    <option value="BA">Bahia</option>
                                    <option value="CE">Ceará</option>
                                    <option value="DF">Distrito Federal</option>
                                    <option value="ES">Espírito Santo</option>
                                    <option value="GO">Goiás</option>
                                    <option value="MA">Maranhão</option>
                                    <option value="MT">Mato Grosso</option>
                                    <option value="MS">Mato Grosso do Sul</option>
                                    <option value="MG">Minas Gerais</option>
                                    <option value="PA">Pará</option>
                                    <option value="PB">Paraíba</option>
                                    <option value="PR">Paraná</option>
                                    <option value="PE">Pernambuco</option>
                                    <option value="PI">Piauí</option>
                                    <option value="RJ">Rio de Janeiro</option>
                                    <option value="RN">Rio Grande do Norte</option>
                                    <option value="RS">Rio Grande do Sul</option>
                                    <option value="RO">Rondônia</option>
                                    <option value="RR">Roraima</option>
                                    <option value="SC">Santa Catarina</option>
                                    <option value="SP">São Paulo</option>
                                    <option value="SE">Sergipe</option>
                                    <option value="TO">Tocantins</option>
                                </select>
                            </div>
                            <div>
                                <label class="block mb-1.5 text-sm font-semibold text-gray-700">Telefone <span
                                        class="text-red-500">*</span></label>
                                <input type="tel" id="telefone" class="input-field" inputmode="numeric"
                                    placeholder="(00) 00000-0000" oninput="formatarTelefone(this)">
                            </div>
                        </div>

                        <div class="pt-4">
                            <button type="submit" id="submit-button"
                                class="submit-btn w-full py-3.5 font-bold text-base flex items-center justify-center gap-2"
                                disabled>
                                <i class="fas fa-arrow-right text-sm"></i>
                                Prosseguir
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-main text-white py-6 text-xs">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex flex-col items-center mb-3">
                <svg height="20" preserveAspectRatio="xMidYMid" viewBox="0 0 69 20" width="69"
                    xmlns="http://www.w3.org/2000/svg" class="mb-2">
                    <path
                        d="M30 20h17v-5H35v-3h12V7H30v13zM50 0v5h19c0-2.47-2.108-5-5-5M50 20h6v-8h8c2.892 0 5-2.53 5-5H50v13zM22 0H9v5h18c-.386-4.118-4.107-5-5-5zm8 5h17V0H30v5zM0 20h6V7H0v13zm9 0h6V7H9v13zm12 0h6V7h-6v13zM0 5h6V0H0v5z"
                        fill="#fff" fill-rule="evenodd"></path>
                </svg>
            </div>
            <div class="border-t border-white/10 pt-3 flex justify-between items-center opacity-60">
                <span>© MEC - Ministério da Educação | INEP</span>
                <span class="flex items-center gap-1"><i class="fas fa-phone-alt"></i> 0800 616161</span>
            </div>
        </div>
    </footer>
